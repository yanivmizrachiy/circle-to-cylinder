<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חוברת המעגל — טוען</title><style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#334155;font-size:18px;font-weight:700}</style></head><body><div class="loading">טוען את עמוד חוברת המעגל…</div><script>(async()=>{try{const match=location.pathname.match(/page-(\d+)\.html$/);const sequence=Number(match?.[1]);if(!Number.isInteger(sequence))throw new Error('מספר עמוד לא תקין');const res=await fetch('manifest.json',{cache:'no-store'});if(!res.ok)throw new Error('manifest HTTP '+res.status);const manifest=await res.json();if(sequence<1||sequence>manifest.pageCount)throw new Error('עמוד מחוץ לטווח');const segment=manifest.segments.find(s=>sequence>=s.from&&sequence<=s.to);if(!segment)throw new Error('לא נמצא מקור לעמוד '+sequence);let source;if(segment.kind==='original'){const n=segment.sourceStart+(sequence-segment.from);source=`source/original-88/page-${n}.html`;}else if(segment.kind==='targilim'){source=`source/targilim/${segment.source}.html`;}else if(segment.kind==='bbb'||segment.kind==='bbb-fragment'){const n=segment.sourceStart+(sequence-segment.from);source=`source/bbb/עמוד-${n}.html`;}else{throw new Error('סוג מקור לא מוכר');}const pageRes=await fetch(source,{cache:'no-store'});if(!pageRes.ok)throw new Error('source HTTP '+pageRes.status+' '+source);const raw=await pageRes.text();const doc=new DOMParser().parseFromString(raw,'text/html');doc.body.innerHTML=doc.body.innerHTML.replaceAll('ס״מ²','סמ״ר').replaceAll('ס״מ³','סמ״ק').replaceAll('ס"מ²','סמ״ר').replaceAll('ס"מ³','סמ״ק');doc.documentElement.lang='he';doc.documentElement.dir='rtl';doc.querySelector('.preview-nav')?.remove();if(segment.kind==='bbb'||segment.kind==='bbb-fragment'){for(const el of doc.querySelectorAll('[href]')){const v=el.getAttribute('href');if(v?.startsWith('vendor/'))el.setAttribute('href',v);else if(v?.startsWith('styles/'))el.setAttribute('href',v);}for(const el of doc.querySelectorAll('[src]')){const v=el.getAttribute('src');if(v?.startsWith('vendor/'))el.setAttribute('src',v);else if(v?.startsWith('pages/bbb/geometry8/assets/'))el.setAttribute('src','source/bbb/assets/'+v.split('/').pop());}if(segment.kind==='bbb-fragment'){const block=doc.querySelector('.question-block');if(!block)throw new Error('חסר question-block במקור BBB');const boundary=[...block.querySelectorAll('.chapter-bar')].find(el=>el.textContent.includes('גליל וחרוט'));if(!boundary)throw new Error('לא נמצא גבול גליל וחרוט');let node=boundary;while(node){const next=node.nextSibling;node.remove();node=next;}if(!block.textContent.includes('ראש העיר רוצה להכפיל את רדיוס הבריכה'))throw new Error('קטע המעגל מ-205 חסר');if(block.textContent.includes('נפח הגלילים'))throw new Error('תוכן גליל חדר לעמוד המעגל');}}const number=doc.querySelector('.page-number');if(!number)throw new Error('חסר מספר עמוד במקור '+source);number.textContent=String(sequence);number.setAttribute('aria-label','עמוד '+sequence);doc.title='חוברת המעגל — עמוד '+sequence;const canonical=doc.createElement('meta');canonical.name='canonical-circle-page';canonical.content=String(sequence);doc.head.append(canonical);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();}catch(err){console.error(err);document.body.innerHTML='<div class="loading">שגיאה בטעינת העמוד: '+String(err.message||err)+'</div>';}})();</script></body></html>
