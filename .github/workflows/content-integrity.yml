name: Content integrity
on:
  push:
    branches:
      - main
      - 'consolidate/**'
  pull_request:
jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check-content.py
