name: Build canonical cone pages once

on:
  push:
    branches:
      - 'consolidate/single-source-of-truth-2026-10-07'
    paths:
      - '.github/workflows/build-cone-once.yml'

permissions:
  contents: write

jobs:
  build-cone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate 46 standalone cone pages from preserved source
        run: python scripts/build-cone-from-preserved.py

      - name: Commit generated canonical cone package
        shell: bash
        run: |
          set -euo pipefail
          git add cone
          if git diff --cached --quiet; then
            echo "No cone generation changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(cone): materialize 46 standalone preserved pages'
          git push origin HEAD:${GITHUB_REF_NAME}
