name: One-time pypdf API update

on:
  push:
    branches:
      - fix/pypdf7-compat-20261008

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update deprecated pypdf argument names
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('scripts/render-release.py'); s=p.read_text(encoding='utf-8'); old='writer.compress_identical_objects(remove_identicals=True, remove_orphans=True)'; new='writer.compress_identical_objects(remove_duplicates=True, remove_unreferenced=True)'; assert old in s; p.write_text(s.replace(old,new,1), encoding='utf-8')"
          rm -f .github/workflows/one-time-pypdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/render-release.py .github/workflows/one-time-pypdf.yml
          git commit -m 'fix(ci): use current pypdf compression API'
          git push origin HEAD:${GITHUB_REF_NAME}
