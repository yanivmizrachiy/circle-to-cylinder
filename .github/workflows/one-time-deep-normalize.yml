name: One-time deep normalization

on:
  push:
    branches:
      - fix/deep-hardening-20261008

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize active typography only
        run: python scripts/normalize-active-typography.py
      - name: Install static QA dependency
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Verify normalized source
        run: |
          python scripts/check-release-ssot.py
          python scripts/check-content.py
          python scripts/check-cone-package.py
      - name: Remove one-time workflow and commit normalized files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-deep-normalize.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to normalize.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(content): normalize active units and gold prompts'
          git push origin HEAD:${GITHUB_REF_NAME}
