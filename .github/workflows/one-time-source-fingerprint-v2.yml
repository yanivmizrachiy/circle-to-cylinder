name: One-time source fingerprint wiring v2

on:
  push:
    branches:
      - fix/pdf-source-fingerprint-v2-20261008

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fingerprint wiring
        run: python scripts/apply-source-fingerprint-patch.py
      - name: Verify syntax and release structure
        run: |
          python -m pip install --disable-pip-version-check pypdf
          python -m py_compile scripts/release_fingerprint.py scripts/render-release.py scripts/check-content.py
          python scripts/check-release-ssot.py
          python scripts/check-cone-package.py
      - name: Remove temporary patcher and commit
        run: |
          rm -f scripts/apply-source-fingerprint-patch.py
          rm -f .github/workflows/one-time-source-fingerprint-v2.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): bind PDF to exact workbook sources'
          git push origin HEAD:fix/pdf-source-fingerprint-v2-20261008
