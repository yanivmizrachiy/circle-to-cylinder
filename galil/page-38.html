<body>
<script type="application/json" id="page">
{
  "n": 38,
  "title": "נפח גליל — סיכום",
  "tight": true,
  "anchor": "שער מעבר: עבדו לפי הנתון בכל שאלה. שמרו על <span dir='ltr'>r</span>, קוטר, <span dir='ltr'>h</span>, <span dir='ltr'>B</span>, <span dir='ltr'>V</span> ועל היחידות המתאימות.",
  "tasks": [
    { "q": "בשרטוט גליל, סמנו איזה סימון מתאים לרדיוס ואיזה לגובה.",
      "blocks": [ { "t": "choice", "opts": ["r — בבסיס", "h — בין הבסיסים", "הפוך"] } ] },
    { "q": "<span dir='ltr'>r=4</span> ס״מ, <span dir='ltr'>h=5</span> ס״מ. השלימו <span dir='ltr'>V = ____π</span> ס״מ³." },
    { "q": "קוטר <span dir='ltr'>10</span> ס״מ, <span dir='ltr'>h=3</span> ס״מ. השלימו <span dir='ltr'>r=____</span> ס״מ, <span dir='ltr'>V=____π</span> ס״מ³." },
    { "q": "בחרו יחידת נפח.",
      "blocks": [ { "t": "choice", "opts": ["ס״מ", "ס״מ²", "ס״מ³"] } ] },
    { "q": "השלימו: <span dir='ltr'>1.5</span> ליטר = ______ ס״מ³." },
    { "q": "בחרו את הסימן: <span dir='ltr'>20π</span> ס״מ³ ___ <span dir='ltr'>62.83</span> ס״מ³.",
      "blocks": [ { "t": "choice", "opts": ["=", "≈"] } ] },
    { "q": "<span dir='ltr'>B=16π</span> ס״מ², <span dir='ltr'>V=80π</span> ס״מ³. השלימו <span dir='ltr'>h=____</span> ס״מ." },
    { "q": "<span dir='ltr'>V=147π</span> ס״מ³, <span dir='ltr'>h=3</span> ס״מ. השלימו <span dir='ltr'>r=____</span> ס״מ." },
    { "q": "נתון קוטר <span dir='ltr'>80</span> מ״מ ו־<span dir='ltr'>h=5</span> ס״מ. המירו תחילה את הקוטר לס״מ, ורק אחר כך חשבו רדיוס ונפח.",
      "blocks": [ { "t": "think", "html": "<span dir='ltr'>קוטר = ______</span> ס״מ ← <span dir='ltr'>r = ______</span> ס״מ ← <span dir='ltr'>V = ______π</span> ס״מ³" } ] },
    { "q": "בחרו את השרשרת התקינה כאשר נתון הקוטר.",
      "blocks": [ { "t": "choice", "opts": ["קוטר, r, B, V", "קוטר, B, V"] } ] },
    { "q": "התאימו לפי היחידה.",
      "blocks": [ { "t": "choice", "opts": ["B — ס״מ²", "V — ס״מ³"] } ] },
    { "q": "מכל בנפח <span dir='ltr'>1200</span> ס״מ³ מכיל <span dir='ltr'>750</span> מ״ל. השלימו: חסרים ______ מ״ל." }
  ]
}
</script>
