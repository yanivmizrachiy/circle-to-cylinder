      "blocks": [ { "t": "choice", "opts": ["ס״מ", "סמ״ר", "סמ״ק"] } ] },
    { "q": "השלימו: <span dir='ltr'>1.5</span> ליטר = ______ סמ״ק." },

    { "q": "<span dir='ltr'>V=147π</span> סמ״ק, <span dir='ltr'>h=3</span> ס״מ. השלימו <span dir='ltr'>r=____</span> ס״מ." },

    { "q": "התאימו לפי היחידה.",
      "blocks": [ { "t": "choice", "opts": ["שטח הבסיס — סמ״ר", "V — סמ״ק"] } ] },
