<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מעגל אל גליל</title>
<meta name="description" content="מעגל אל גליל — חוברת עבודה מתמטית מדורגת בעברית מהמעגל אל הגליל">
<meta property="og:title" content="מעגל אל גליל">
<meta property="og:description" content="מעגל אל גליל — חוברת עבודה מתמטית מדורגת בעברית מהמעגל אל הגליל">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:'Rubik','Heebo','Noto Sans Hebrew',Arial,sans-serif;color:#0f172a;direction:rtl}

/* Top Toolbar */
.top-bar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid #cbd5e1;box-shadow:0 3px 12px rgba(15,23,42,.08);padding:10px 16px}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.bar-title-group{display:flex;align-items:center;gap:10px}
.bar-title{margin:0;font-size:18px;font-weight:700;color:#1e3a8a;display:flex;align-items:center;gap:6px}
.bar-badge{font-size:12px;font-weight:600;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:12px;padding:2px 8px}

.bar-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn-group{display:inline-flex;background:#f1f5f9;padding:3px;border-radius:8px;border:1px solid #e2e8f0}
.btn-group button{border:none;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;font-family:inherit;color:#475569;border-radius:6px;cursor:pointer;transition:all .15s}
.btn-group button.active{background:#fff;color:#1e3a8a;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.chapter-select{padding:6px 10px;font-size:13px;font-weight:500;font-family:inherit;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#1e293b;cursor:pointer;outline:none;max-width:240px}
.jump-box{display:flex;align-items:center;gap:6px}
.jump-input{width:56px;padding:5px 8px;font-size:13px;font-family:inherit;text-align:center;border:1px solid #cbd5e1;border-radius:6px;outline:none}
.btn-action{padding:6px 12px;font-size:13px;font-weight:600;font-family:inherit;background:#1e3a8a;color:#fff;border:none;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s}
.btn-action:hover{background:#1d4ed8}
.btn-action.secondary{background:#fff;color:#1e293b;border:1px solid #cbd5e1}
.btn-action.secondary:hover{background:#f8fafc}
.btn-action.active{background:#1e3a8a;color:#fff}

/* Editor Inspector Bar */
.editor-bar{display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:6px 12px;background:#fefce8;border:1px solid #fde047;border-radius:8px;margin-top:8px;font-size:13px}
.editor-bar.visible{display:flex}
.editor-info{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.editor-tag{font-weight:700;color:#854d0e}
.editor-code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#fef08a;padding:2px 7px;border-radius:4px;color:#713f12;font-size:12px;font-weight:600;direction:ltr;unicode-bidi:isolate}
.btn-sm{padding:3px 8px;font-size:12px}
.copy-toast{display:none;color:#15803d;font-weight:700;font-size:12px}
.copy-toast.show{display:inline}
.editor-meta{color:#a16207;font-weight:500;font-size:12px}

/* Single Page View Bar */
.single-nav{display:none;align-items:center;justify-content:center;gap:12px;padding:8px 0;background:#f8fafc;border-top:1px solid #e2e8f0;margin-top:8px}
.single-nav.visible{display:flex}
.page-indicator{font-size:14px;font-weight:600;color:#1e3a8a}

/* Book Container */
.book-wrapper{padding:14px 10px 40px;min-height:calc(100vh - 110px);display:flex;flex-direction:column;align-items:center}
.book{max-width:1060px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.slot{position:relative;width:794px;max-width:100%;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 30px rgba(15,23,42,.07);overflow:hidden}
.slot.hidden{display:none}
.slot iframe{display:block;width:100%;height:100%;border:0;background:#fff;overflow:hidden;pointer-events:none}
.single-mode .slot iframe{pointer-events:auto}
.slot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#94a3b8;font-weight:700;font-size:15px;background:#f8fafc}
.slot .ph-spinner{width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:#1e3a8a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Single Page Container */
.single-stage{display:none;width:100%;max-width:850px;flex-direction:column;align-items:center;gap:12px}
.single-stage.visible{display:flex}
.single-card{position:relative;width:794px;max-width:100%;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 36px rgba(15,23,42,.1);overflow:hidden}
.single-card iframe{display:block;width:100%;height:100%;border:0;background:#fff;overflow:hidden}

@media(max-width:760px){
  .top-bar{padding:8px 10px}
  .bar-row{gap:8px}
  .bar-title{font-size:16px}
  .chapter-select{max-width:100%;width:100%}
  .book-wrapper{padding:8px 4px}
  .slot{border-radius:6px}
}

@media print{
  .top-bar{display:none!important}
  body{background:#fff}
  .book-wrapper{padding:0}
  .book{gap:0;max-width:none}
  .slot{width:100%!important;border:none;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
  .single-stage{display:none!important}
}
</style>
</head>
<body>

<header class="top-bar">
  <div class="bar-row">
    <div class="bar-title-group">
      <h1 class="bar-title">📐 מעגל אל גליל</h1>
      <span class="bar-badge" id="totalBadge">138 עמודים</span>
    </div>

    <div class="bar-controls">
      <!-- Booklet Scope -->
      <div class="btn-group" role="group" aria-label="סינון חוברת">
        <button id="btnAll" class="active" onclick="setScope('all')">הכל (138)</button>
        <button id="btnMaagal" onclick="setScope('maagal')">מעגל (99)</button>
        <button id="btnGalil" onclick="setScope('galil')">גליל (39)</button>
      </div>

      <!-- Mode Toggle -->
      <div class="btn-group" role="group" aria-label="מצב תצוגה">
        <button id="btnScroll" class="active" onclick="setViewMode('scroll')" title="גלילה רציפה של כל הדפים">📜 גלילה רציפה</button>
        <button id="btnSingle" onclick="setViewMode('single')" title="דפדוף עמוד בודד באיכות מלאה">📄 עמוד בודד</button>
      </div>

      <!-- Chapter Selector -->
      <select id="chapterSelect" class="chapter-select" onchange="jumpToChapter(this.value)" aria-label="בחירת פרק"></select>

      <!-- Jump To Page -->
      <div class="jump-box">
        <input type="number" id="jumpInput" class="jump-input" min="1" max="138" placeholder="1" aria-label="מספר עמוד">
        <button class="btn-action secondary" onclick="handleJump()">עבור</button>
      </div>

      <!-- Print Button -->
      <button class="btn-action" onclick="window.print()" title="הדפסת החוברת">🖨️ הדפסה</button>
      
      <!-- Developer & Editor Inspector Toggle -->
      <button class="btn-action secondary" id="btnInspectorToggle" onclick="toggleInspector()" title="הצג/הסתר סרגל איתור מקור לעריכה מהירה">🛠️ מקור לעריכה</button>
    </div>
  </div>

  <!-- Source File Editor Inspector Bar -->
  <div class="editor-bar" id="editorBar">
    <div class="editor-info">
      <span class="editor-tag">📍 קובץ מקור לעריכה בדיסק:</span>
      <code class="editor-code" id="editorFile">maagal/source/original-88/page-1.html</code>
      <button class="btn-action secondary btn-sm" onclick="copySourcePath()" title="העתק נתיב ללוח">📋 העתק נתיב</button>
      <button class="btn-action secondary btn-sm" onclick="reloadActivePage()" title="רענון מיידי של עמוד זה מהדיסק">🔄 רענן עמוד</button>
      <span class="copy-toast" id="copyToast">הנתיב הועתק!</span>
    </div>
    <div class="editor-meta">
      <span id="editorChapter" class="editor-chapter">מקטע 1: יסודות</span>
    </div>
  </div>

  <!-- Single page navigation bar -->
  <div class="single-nav" id="singleNav">
    <button class="btn-action secondary" onclick="stepSingle(-1)">➡️ עמוד קודם</button>
    <span class="page-indicator" id="singleIndicator">עמוד 1 מתוך 138</span>
    <button class="btn-action secondary" onclick="stepSingle(1)">עמוד הבא ⬅️</button>
    <button class="btn-action secondary" onclick="openCurrentPage()" title="פתח עמוד בודד בחלון נפרד">🔗 פתח בנפרד</button>
  </div>
</header>

<main class="book-wrapper">
  <!-- Continuous Scroll Book -->
  <div class="book" id="book" aria-label="כל עמודי החוברת"></div>

  <!-- Single Page Stage -->
  <div class="single-stage" id="singleStage">
    <div class="single-card" id="singleCard">
      <iframe id="singleFrame" title="עמוד יחיד" loading="eager"></iframe>
    </div>
  </div>
</main>

<script>
const PAGE_W = 794;
const PAGE_H = 1123;
const MAAGAL_COUNT = 99;
const GALIL_COUNT = 39;
const TOTAL_PAGES = MAAGAL_COUNT + GALIL_COUNT;

const book = document.getElementById('book');
const singleStage = document.getElementById('singleStage');
const singleNav = document.getElementById('singleNav');
const singleFrame = document.getElementById('singleFrame');
const singleCard = document.getElementById('singleCard');
const singleIndicator = document.getElementById('singleIndicator');
const chapterSelect = document.getElementById('chapterSelect');
const jumpInput = document.getElementById('jumpInput');
const editorBar = document.getElementById('editorBar');
const editorFile = document.getElementById('editorFile');
const editorChapter = document.getElementById('editorChapter');
const copyToast = document.getElementById('copyToast');
const btnInspectorToggle = document.getElementById('btnInspectorToggle');

let currentScope = 'all'; // 'all' | 'maagal' | 'galil'
let currentMode = 'scroll'; // 'scroll' | 'single'
let currentSinglePage = 1;
let activePage = 1;
let inspectorVisible = false;
let pagesMeta = {};
let slots = [];

// Fetch SSOT metadata for all pages from backend
fetch('/api/pages').then(r => r.json()).then(data => {
  (data || []).forEach(p => { if (p) pagesMeta[p.sequence] = p; });
  updateActivePageInfo(activePage);
}).catch(() => {});

function toggleInspector() {
  inspectorVisible = !inspectorVisible;
  editorBar.classList.toggle('visible', inspectorVisible);
  btnInspectorToggle.classList.toggle('active', inspectorVisible);
  if (inspectorVisible) updateActivePageInfo(activePage);
}

function updateActivePageInfo(n) {
  activePage = n;
  const meta = pagesMeta[n];
  if (meta) {
    editorFile.textContent = meta.sourceFile;
    editorChapter.textContent = `${meta.bookletTitle} • עמ' ${meta.pageInBooklet} מתוך ${meta.totalPagesInBooklet} • ${meta.chapter}`;
  } else {
    editorFile.textContent = getPageSrc(n);
    editorChapter.textContent = `עמוד ${n}`;
  }
}

function copySourcePath() {
  const text = editorFile.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    copyToast.classList.add('show');
    setTimeout(() => copyToast.classList.remove('show'), 2000);
  });
}

function reloadActivePage() {
  if (currentMode === 'single') {
    singleFrame.src = getPageSrc(currentSinglePage) + '?t=' + Date.now();
  } else {
    const slot = document.getElementById('p' + activePage);
    if (slot && slot._frame) {
      slot._frame.src = slot._src + '?t=' + Date.now();
      scheduleFit(slot);
    }
  }
}

const CHAPTERS = [
  { name: '1. יסודות: מרכז, רדיוס, קוטר ומיתר', page: 1, scope: 'maagal' },
  { name: '2. היקף והקבוע π', page: 22, scope: 'maagal' },
  { name: '3. שטח העיגול', page: 36, scope: 'maagal' },
  { name: '4. יישום, אלגברה ומידול', page: 54, scope: 'maagal' },
  { name: '5. מעגל במערכת צירים', page: 74, scope: 'maagal' },
  { name: '6. שאלות מתוכנית הלימודים', page: 86, scope: 'maagal' },
  { name: '7. גשר אל הגליל', page: 95, scope: 'maagal' },
  { name: '8. גליל: מושגים בסיסיים והכרת הגוף', page: 100, scope: 'galil' },
  { name: '9. גליל: פריסה, מעטפת ושטח פנים', page: 110, scope: 'galil' },
  { name: '10. גליל: נפח ובעיות מורכבות', page: 124, scope: 'galil' }
];

function getPageSrc(n) {
  if (n <= MAAGAL_COUNT) {
    return `maagal/page-${n}.html`;
  }
  const galilPage = n - MAAGAL_COUNT;
  return `galil/page-${galilPage}.html`;
}

function displayWidth() {
  const cs = getComputedStyle(book);
  const pad = parseFloat(cs.paddingLeft || 0) + parseFloat(cs.paddingRight || 0);
  const w = window.innerWidth - 32;
  return Math.max(260, Math.min(PAGE_W, Math.floor(w)));
}

function sizeSlot(slot) {
  const dw = displayWidth();
  const scale = dw / PAGE_W;
  slot.style.width = dw + 'px';
  slot.style.height = Math.round(PAGE_H * scale) + 'px';
}

function fitIframe(slot) {
  const f = slot._frame;
  if (!f) return false;
  try {
    const doc = f.contentDocument;
    if (!doc) return false;
    const p = doc.querySelector('.a4-page');
    if (!p) return false;
    const target = slot.clientWidth || displayWidth();
    const scale = target / PAGE_W;
    const de = doc.documentElement;
    const bd = doc.body;
    de.style.overflow = 'hidden';
    de.style.margin = '0';
    de.style.padding = '0';
    if (bd) {
      bd.style.margin = '0';
      bd.style.padding = '0';
      bd.style.position = 'relative';
      bd.style.overflow = 'hidden';
      bd.style.width = target + 'px';
      bd.style.height = Math.ceil(PAGE_H * scale) + 'px';
    }
    p.style.margin = '0';
    p.style.position = 'absolute';
    p.style.left = '0';
    p.style.top = '0';
    p.style.transformOrigin = 'top left';
    p.style.transform = `scale(${scale})`;
    slot.style.height = Math.round(PAGE_H * scale) + 'px';
    const el = slot.querySelector('.ph');
    if (el) el.remove();
    return true;
  } catch (e) {
    return false;
  }
}

function scheduleFit(slot) {
  let attempts = 0;
  const iv = setInterval(() => {
    attempts++;
    if (fitIframe(slot) || attempts > 80) clearInterval(iv);
  }, 40);
}

function loadSlot(slot) {
  if (slot._loaded) return;
  slot._loaded = true;
  const n = slot._page;
  const f = document.createElement('iframe');
  f.title = `עמוד ${n}`;
  f.loading = 'eager';
  f.scrolling = 'no';
  f.setAttribute('scrolling', 'no');
  slot._frame = f;
  f.addEventListener('load', () => scheduleFit(slot));
  slot.appendChild(f);
  f.src = slot._src;
}

function buildBook() {
  book.replaceChildren();
  slots = [];
  
  for (let n = 1; n <= TOTAL_PAGES; n++) {
    const slot = document.createElement('section');
    slot.className = 'slot';
    slot.id = 'p' + n;
    slot._page = n;
    slot._src = getPageSrc(n);
    slot.setAttribute('data-page', n);
    
    // Label
    const ph = document.createElement('div');
    ph.className = 'ph';
    const spinner = document.createElement('div');
    spinner.className = 'ph-spinner';
    const txt = document.createElement('span');
    const label = n <= MAAGAL_COUNT ? `מעגל — עמוד ${n}` : `גליל — עמוד ${n - MAAGAL_COUNT} (עמוד ${n})`;
    txt.textContent = label;
    ph.appendChild(spinner);
    ph.appendChild(txt);
    slot.appendChild(ph);
    
    book.appendChild(slot);
    sizeSlot(slot);
    slots.push(slot);
  }

  // Pre-load first 5 pages immediately
  for (let i = 0; i < Math.min(5, slots.length); i++) {
    loadSlot(slots[i]);
  }

  // IntersectionObserver for eager progressive loading
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          loadSlot(e.target);
          io.unobserve(e.target);
        }
      });
    }, { root: null, rootMargin: '1200px 0px', threshold: 0 });
    
    slots.forEach((sl) => io.observe(sl));

    // Active page tracker during scroll
    const trackIo = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const num = Number(e.target.getAttribute('data-page'));
          if (num && currentMode === 'scroll') {
            updateActivePageInfo(num);
          }
        }
      });
    }, { root: null, rootMargin: '-10% 0px -70% 0px', threshold: 0 });
    slots.forEach((sl) => trackIo.observe(sl));
  } else {
    slots.forEach(loadSlot);
  }

  applyScopeFilter();
}

function applyScopeFilter() {
  slots.forEach((sl) => {
    const n = sl._page;
    let visible = true;
    if (currentScope === 'maagal' && n > MAAGAL_COUNT) visible = false;
    if (currentScope === 'galil' && n <= MAAGAL_COUNT) visible = false;
    if (visible) {
      sl.classList.remove('hidden');
    } else {
      sl.classList.add('hidden');
    }
  });
}

function setScope(scope) {
  currentScope = scope;
  document.getElementById('btnAll').classList.toggle('active', scope === 'all');
  document.getElementById('btnMaagal').classList.toggle('active', scope === 'maagal');
  document.getElementById('btnGalil').classList.toggle('active', scope === 'galil');
  
  if (scope === 'maagal') {
    document.getElementById('totalBadge').textContent = 'מעגל (99 עמודים)';
  } else if (scope === 'galil') {
    document.getElementById('totalBadge').textContent = 'גליל (39 עמודים)';
  } else {
    document.getElementById('totalBadge').textContent = '138 עמודים';
  }

  applyScopeFilter();
  updateChapterOptions();

  if (currentMode === 'single') {
    if (scope === 'maagal' && currentSinglePage > MAAGAL_COUNT) {
      renderSinglePage(1);
    } else if (scope === 'galil' && currentSinglePage <= MAAGAL_COUNT) {
      renderSinglePage(MAAGAL_COUNT + 1);
    }
  }
}

function setViewMode(mode) {
  currentMode = mode;
  document.getElementById('btnScroll').classList.toggle('active', mode === 'scroll');
  document.getElementById('btnSingle').classList.toggle('active', mode === 'single');
  
  if (mode === 'scroll') {
    book.style.display = 'flex';
    singleStage.classList.remove('visible');
    singleNav.classList.remove('visible');
    document.body.classList.remove('single-mode');
    setTimeout(() => {
      const target = document.getElementById('p' + currentSinglePage);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    }, 50);
  } else {
    book.style.display = 'none';
    singleStage.classList.add('visible');
    singleNav.classList.add('visible');
    document.body.classList.add('single-mode');
    renderSinglePage(currentSinglePage);
  }
}

function renderSinglePage(n) {
  let min = 1;
  let max = TOTAL_PAGES;
  if (currentScope === 'maagal') max = MAAGAL_COUNT;
  if (currentScope === 'galil') min = MAAGAL_COUNT + 1;
  
  n = Math.max(min, Math.min(max, n));
  currentSinglePage = n;

  const dw = displayWidth();
  const scale = dw / PAGE_W;
  singleCard.style.width = dw + 'px';
  singleCard.style.height = Math.round(PAGE_H * scale) + 'px';

  singleFrame.src = getPageSrc(n);
  singleFrame.onload = () => {
    try {
      const doc = singleFrame.contentDocument;
      if (!doc) return;
      const p = doc.querySelector('.a4-page');
      if (!p) return;
      const target = singleCard.clientWidth || displayWidth();
      const sc = target / PAGE_W;
      p.style.margin = '0';
      p.style.position = 'absolute';
      p.style.left = '0';
      p.style.top = '0';
      p.style.transformOrigin = 'top left';
      p.style.transform = `scale(${sc})`;
      doc.body.style.margin = '0';
      doc.body.style.overflow = 'hidden';
      doc.body.style.width = target + 'px';
      doc.body.style.height = Math.ceil(PAGE_H * sc) + 'px';
    } catch(e) {}
  };

  const label = n <= MAAGAL_COUNT ? `מעגל — עמוד ${n} מתוך 99` : `גליל — עמוד ${n - MAAGAL_COUNT} מתוך 39 (עמוד ${n} ברצף)`;
  singleIndicator.textContent = label;
  jumpInput.value = n;
  updateActivePageInfo(n);
}

function stepSingle(delta) {
  renderSinglePage(currentSinglePage + delta);
}

function openCurrentPage() {
  const url = getPageSrc(currentSinglePage);
  window.open(url, '_blank');
}

function updateChapterOptions() {
  chapterSelect.innerHTML = '<option value="">-- דלג למקטע / נושא --</option>';
  CHAPTERS.forEach((c) => {
    if (currentScope === 'maagal' && c.scope !== 'maagal') return;
    if (currentScope === 'galil' && c.scope !== 'galil') return;
    const opt = document.createElement('option');
    opt.value = c.page;
    opt.textContent = c.name;
    chapterSelect.appendChild(opt);
  });
}

function jumpToChapter(pageStr) {
  if (!pageStr) return;
  const n = parseInt(pageStr, 10);
  if (currentMode === 'single') {
    renderSinglePage(n);
  } else {
    const el = document.getElementById('p' + n);
    if (el) {
      loadSlot(el);
      el.scrollIntoView({ behavior: 'smooth' });
    }
  }
}

function handleJump() {
  const v = parseInt(jumpInput.value, 10);
  if (isNaN(v)) return;
  if (currentMode === 'single') {
    renderSinglePage(v);
  } else {
    const el = document.getElementById('p' + v);
    if (el) {
      loadSlot(el);
      el.scrollIntoView({ behavior: 'smooth' });
    }
  }
}

jumpInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleJump();
});

// Keyboard navigation in single page mode
window.addEventListener('keydown', (e) => {
  if (currentMode !== 'single') return;
  if (e.key === 'ArrowLeft') stepSingle(1);
  if (e.key === 'ArrowRight') stepSingle(-1);
});

// Resize handler
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (currentMode === 'scroll') {
      slots.forEach((sl) => {
        sizeSlot(sl);
        if (sl._loaded) fitIframe(sl);
      });
    } else {
      renderSinglePage(currentSinglePage);
    }
  }, 100);
});

updateChapterOptions();
buildBook();

// URL hash handling
if (location.hash) {
  const targetId = location.hash.slice(1);
  const num = parseInt(targetId.replace(/^p/, ''), 10);
  if (num) {
    setTimeout(() => {
      const el = document.getElementById('p' + num);
      if (el) {
        loadSlot(el);
        el.scrollIntoView();
      }
    }, 150);
  }
}
</script>
</body>
</html>
