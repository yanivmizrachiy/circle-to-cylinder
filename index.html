<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מעגל אל גליל</title>
<style>
  :root{--blue:#1d4ed8;--ink:#1e3a8a;--muted:#475569;--line:#cbd5e1;--panel:#eff4ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Rubik","Heebo","Noto Sans Hebrew",Arial,sans-serif;
       background:linear-gradient(160deg,#eef2f7,#dbe6fb);color:#111827;display:grid;place-items:center;padding:24px}
  .wrap{width:100%;max-width:720px}
  header{text-align:center;margin-bottom:26px}
  h1{font-size:34px;margin:0;color:var(--ink)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:560px){.cards{grid-template-columns:1fr}h1{font-size:28px}}
  a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);
         border-radius:16px;padding:28px 20px;text-align:center;box-shadow:0 2px 10px rgba(30,58,138,.07);transition:transform .12s,box-shadow .12s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(30,58,138,.15);border-color:var(--blue)}
  .tag{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);background:var(--panel);
       border:1px solid #c7d7fb;border-radius:999px;padding:2px 11px;margin-bottom:10px}
  .card h2{margin:0;font-size:23px;color:var(--ink)}
  footer{text-align:center;margin-top:26px;color:var(--muted);font-size:12.5px;line-height:1.6}
  footer a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>מעגל אל גליל</h1>
  </header>
  <div class="cards">
    <a class="card" href="maagal/index.html">
      <span class="tag">99 עמודים</span>
      <h2>חוברת המעגל</h2>
    </a>
    <a class="card" href="galil/index.html">
      <span class="tag">39 עמודים</span>
      <h2>חוברת הגליל</h2>
    </a>
  </div>
  <footer>
    יניב רז — מדריך מחוזי חט״ב · מנח״י, ירושלים<br>
    <a href="https://github.com/yanivmizrachiy/circle-to-cylinder">github.com/yanivmizrachiy/circle-to-cylinder</a>
  </footer>
</div>
</body>
</html>
