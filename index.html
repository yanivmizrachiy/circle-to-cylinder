<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מעגל אל גליל</title>
<meta name="description" content="מעגל אל גליל — חוברת עבודה מתמטית מדורגת בעברית מהמעגל אל הגליל">
<meta property="og:title" content="מעגל אל גליל">
<meta property="og:description" content="מעגל אל גליל — חוברת עבודה מתמטית מדורגת בעברית מהמעגל אל הגליל">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:98px;background:#f3f6fb;font-family:'Rubik','Heebo','Noto Sans Hebrew',Arial,sans-serif;color:#152033}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:center;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-top:3px solid #c9a227;border-bottom:1px solid #e0e6f1;box-shadow:0 8px 30px rgba(30,58,138,.12)}
.nav button{position:relative;flex:1 1 0;max-width:380px;font-family:'Frank Ruhl Libre','Rubik',serif;font-size:31px;font-weight:700;color:#17306e;background:transparent;border:0;padding:24px 14px 26px;cursor:pointer;letter-spacing:.6px;transition:color .28s ease}
.nav button + button{border-inline-start:2px solid #1e3a8a}
.nav button::after{content:"";position:absolute;bottom:13px;left:50%;transform:translateX(-50%);width:0;height:3px;border-radius:3px;background:linear-gradient(90deg,#c9a227,#ecd07a 50%,#c9a227);transition:width .4s cubic-bezier(.2,.7,.2,1)}
.nav button:hover{color:#1e3a8a}
.nav button:hover::after{width:54%}
.nav button.active{color:#1e3a8a}
.nav button.active::after{width:54%}
.download{flex:0 0 auto;align-self:center;display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:8px;padding:12px 16px;border-radius:10px;background:#1e3a8a;color:#fff;font-size:16px;font-weight:500;text-decoration:none;transition:background .2s ease}
.download:hover{background:#1d4ed8}
.download:focus-visible{outline:3px solid #c9a227;outline-offset:3px}
.book{transition:opacity .3s ease}
.book{max-width:1060px;margin:0 auto 24px;padding:0 10px;display:flex;flex-direction:column;align-items:center;gap:0}
.slot{position:relative;width:794px;max-width:100%;background:#fff;overflow:hidden;scroll-margin-top:110px}
.slot + .slot{border-top:3px solid #1e3a8a}
.slot iframe{display:block;width:100%;height:100%;border:0;background:#fff;overflow:hidden;pointer-events:none}
html,body{overflow-x:hidden;max-width:100%}
.slot .ph{position:absolute;inset:0;background:linear-gradient(100deg,#f7f9fc 30%,#eceff7 50%,#f7f9fc 70%);background-size:200% 100%;animation:ph-sh 1.4s linear infinite}
@keyframes ph-sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:760px){body{padding-top:66px}.book{margin-top:0;padding:0 6px;gap:0}.nav button{font-size:22px;padding:17px 6px 19px}.nav button::after{bottom:9px}.slot{scroll-margin-top:78px}}
@media print{
 .nav{display:none}
 body{background:#fff;padding-top:0}
 .book{margin:0;padding:0;max-width:none;gap:0}
 .slot{width:100%!important;border:none;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
 .slot + .slot{border-top:0}
}
</style>
</head><body>
<nav class="nav" aria-label="ניווט מהיר בין חלקי החוברת">
 <button type="button" data-sec="circle" onclick="jump('circle')">מעגל</button>
 <button type="button" data-sec="cylinder" onclick="jump('cylinder')">גליל</button>
 <button type="button" data-sec="cone" onclick="jump('cone')">חרוט</button>
 <a class="download" href="assets/circle-to-cylinder.pdf" download="מעגל-גליל-חרוט.pdf">הורדה</a>
</nav>
<main class="book" id="book" aria-label="כל עמודי החוברת"></main>
<script>
const PAGE_W=794,PAGE_H=1123,GOLD_CYL=7,GALIL=39;
const book=document.getElementById('book');
let pages=[],slots=[];
let SEC={circle:1,cylinder:100,cone:146};
const navBtns=Array.prototype.slice.call(document.querySelectorAll('.nav button'));
function setActive(sec){navBtns.forEach(function(b){b.classList.toggle('active',b.getAttribute('data-sec')===sec);});}
function absTop(el){const r=el.getBoundingClientRect();return r.top+window.pageYOffset;}
function currentSec(){const y=window.pageYOffset+140;const cy=document.getElementById('p'+SEC.cylinder),co=document.getElementById('p'+SEC.cone);if(co&&y>=absTop(co))return 'cone';if(cy&&y>=absTop(cy))return 'cylinder';return 'circle';}
let spying=false;
function onScroll(){if(spying)return;spying=true;requestAnimationFrame(function(){setActive(currentSec());spying=false;});}
window.addEventListener('scroll',onScroll,{passive:true});
function jump(sec){const n=SEC[sec]||1;const t=document.getElementById('p'+n);if(!t)return;if(!t._loaded)loadSlot(t);setActive(sec);book.style.opacity='0';setTimeout(function(){t.scrollIntoView({block:'start'});requestAnimationFrame(function(){book.style.opacity='1';});},230);}
function displayWidth(){const cs=getComputedStyle(book);const pad=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);return Math.max(200,Math.min(PAGE_W,Math.floor(book.clientWidth-pad)));}
function sizeSlot(slot){const dw=displayWidth(),scale=dw/PAGE_W;slot.style.width=dw+'px';slot.style.height=Math.round(PAGE_H*scale)+'px';}
function fitIframe(slot){const f=slot._frame;if(!f)return false;try{const doc=f.contentDocument;if(!doc)return false;const p=doc.querySelector('.a4-page');if(!p)return false;const target=f.clientWidth||displayWidth(),pw=p.offsetWidth||PAGE_W,ph=p.offsetHeight||PAGE_H,scale=target/pw;const de=doc.documentElement,bd=doc.body;de.style.overflow='hidden';de.style.margin='0';de.style.padding='0';if(bd){bd.style.margin='0';bd.style.padding='0';bd.style.position='relative';bd.style.overflow='hidden';bd.style.width=target+'px';bd.style.height=Math.ceil(ph*scale)+'px';}p.style.margin='0';p.style.position='absolute';p.style.left='0';p.style.top='0';p.style.transformOrigin='top left';p.style.transform='scale('+scale+')';slot.style.height=Math.round(ph*scale)+'px';const el=slot.querySelector('.ph');if(el)el.remove();return true;}catch(e){return false;}}
function scheduleFit(slot){let n=0;const iv=setInterval(()=>{n++;if(fitIframe(slot)||n>60)clearInterval(iv);},50);}
function loadSlot(slot){if(slot._loaded)return;slot._loaded=true;const n=slot._page;const f=document.createElement('iframe');f.title=`עמוד ${n}`;f.loading='eager';f.scrolling='no';f.setAttribute('scrolling','no');slot._frame=f;f.addEventListener('load',()=>scheduleFit(slot));slot.appendChild(f);f.src=slot._src;}
function startLoading(){
 if('IntersectionObserver' in window){
  const io=new IntersectionObserver(function(ents){ents.forEach(function(e){if(e.isIntersecting){loadSlot(e.target);io.unobserve(e.target);}});},{root:null,rootMargin:'1400px 0px',threshold:0});
  slots.forEach(function(sl){io.observe(sl);});
 }
 let qi=0;(function pump(){let did=0;while(qi<slots.length&&did<2){const sl=slots[qi++];if(!sl._loaded){loadSlot(sl);did++;}}if(qi<slots.length)setTimeout(pump,110);})();
}
function build(){book.replaceChildren();slots=[];for(let i=0;i<pages.length;i++){const n=i+1;const slot=document.createElement('section');slot.className='slot';slot.id='p'+n;slot._page=n;slot._src=pages[i];slot.setAttribute('data-page',n);const ph=document.createElement('div');ph.className='ph';slot.appendChild(ph);book.appendChild(slot);sizeSlot(slot);slots.push(slot);}startLoading();setActive('circle');if(location.hash){let k=0;const j=function(){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();if(++k<8)setTimeout(j,90);};setTimeout(j,60);}}
window.addEventListener('hashchange',function(){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{slots.forEach(sl=>{sizeSlot(sl);if(sl._loaded)fitIframe(sl);});},150);});
function assemble(maagalCount){pages=[];for(let n=1;n<=maagalCount;n++)pages.push(`maagal/page-${n}.html`);for(let n=1;n<=GOLD_CYL;n++)pages.push(`gold/page-${n}.html`);for(let n=1;n<=GALIL;n++)pages.push(`galil/page-${n}.html`);pages.push('gold/page-8.html');SEC={circle:1,cylinder:maagalCount+1,cone:maagalCount+GOLD_CYL+GALIL+1};build();}
fetch('maagal/manifest.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{assemble(Number(m.pageCount)||99);}).catch(e=>{assemble(99);});
</script>
</body></html>
