<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>גליל — נפח ושטח מעטפת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>

<main class="a4-page flow">
  <header class="page-header">
    <div class="header-titles">
      <h1 class="page-title">גליל</h1>
      <p class="page-subtitle">שאלות מתוך תוכנית הלימודים</p>
    </div>
    <div class="page-number" aria-label="עמוד 4">4</div>
  </header>

  <div class="calc-list">

    <section class="calc">
      <div class="calc-main">
        <p class="calc-given">נתון: רדיוס = 3 ס״מ (ושאר הנתונים בסרטוט).</p>
        <div class="steps">
          <div class="step">
            <p class="q-line"><span class="q-dot"></span>חשבו את נפח הגליל:</p>
            <div class="grid-paper"></div>
            <p class="ans-line"><span class="ans-lead">תשובה:</span><span class="blank ans-blank"></span><span class="unit">סמ״ק</span></p>
          </div>
          <div class="step">
            <p class="q-line"><span class="q-dot"></span>חשבו את שטח המעטפת של הגליל:</p>
            <div class="grid-paper"></div>
            <p class="ans-line"><span class="ans-lead">תשובה:</span><span class="blank ans-blank"></span><span class="unit">סמ״ר</span></p>
          </div>
        </div>
      </div>
      <div class="calc-fig">
        <svg viewBox="0 0 200 250" role="img" aria-label="גליל: רדיוס 3 ס״מ, גובה 10 ס״מ">
          <line class="cyl-dim" x1="22" y1="55" x2="22" y2="195" marker-start="url(#ah2)" marker-end="url(#ah2)"/>
          <text class="lbl-dim" transform="rotate(-90 11 125)" x="11" y="125" text-anchor="middle">h = &#x2067;10 ס״מ&#x2069;</text>
          <ellipse class="cyl-base-fill" cx="100" cy="195" rx="58" ry="16"/>
          <path class="cyl-hidden" d="M42 195 A58 16 0 0 1 158 195"/>
          <line class="cyl" x1="42" y1="55" x2="42" y2="195"/>
          <line class="cyl" x1="158" y1="55" x2="158" y2="195"/>
          <path class="cyl" d="M42 195 A58 16 0 0 0 158 195"/>
          <ellipse class="cyl cyl-base" cx="100" cy="55" rx="58" ry="16"/>
          <line class="cyl-dim" x1="100" y1="55" x2="158" y2="55" marker-end="url(#ah2)"/>
          <circle class="dot" cx="100" cy="55" r="3.2"/>
          <text class="lbl-dim" x="100" y="33" text-anchor="middle">r = &#x2067;3 ס״מ&#x2069;</text>
        </svg>
      </div>
    </section>

    <section class="calc">
      <div class="calc-main">
        <p class="calc-given">נתון: שטח ABCD הוא 60 סמ״ר, גובה = 8 ס״מ, רדיוס = 5 ס״מ.</p>
        <div class="steps">
          <div class="step">
            <p class="q-line"><span class="q-dot"></span>חשבו את נפח הגליל:</p>
            <div class="grid-paper"></div>
            <p class="ans-line"><span class="ans-lead">תשובה:</span><span class="blank ans-blank"></span><span class="unit">סמ״ק</span></p>
          </div>
          <div class="step">
            <p class="q-line"><span class="q-dot"></span>חשבו את שטח המעטפת של הגליל:</p>
            <div class="grid-paper"></div>
            <p class="ans-line"><span class="ans-lead">תשובה:</span><span class="blank ans-blank"></span><span class="unit">סמ״ר</span></p>
          </div>
        </div>
      </div>
      <div class="calc-fig">
        <svg viewBox="0 0 200 250" role="img" aria-label="גליל ABCD: רדיוס 5 ס״מ, גובה 8 ס״מ">
          <line class="cyl-dim" x1="22" y1="55" x2="22" y2="195" marker-start="url(#ah2)" marker-end="url(#ah2)"/>
          <text class="lbl-dim" transform="rotate(-90 11 125)" x="11" y="125" text-anchor="middle">h = &#x2067;8 ס״מ&#x2069;</text>
          <ellipse class="cyl-base-fill" cx="100" cy="195" rx="58" ry="16"/>
          <path class="cyl-hidden" d="M42 195 A58 16 0 0 1 158 195"/>
          <line class="cyl-blue" x1="42" y1="55" x2="42" y2="195"/>
          <line class="cyl-blue" x1="158" y1="55" x2="158" y2="195"/>
          <path class="cyl-blue" d="M42 195 A58 16 0 0 0 158 195"/>
          <ellipse class="cyl-base" cx="100" cy="55" rx="58" ry="16" stroke="#1d4ed8" stroke-width="2.4"/>
          <line class="cyl-dim" x1="100" y1="55" x2="158" y2="55" marker-end="url(#ah2)"/>
          <circle class="dot" cx="100" cy="55" r="3.2"/>
          <text class="lbl-dim" x="100" y="33" text-anchor="middle">r = &#x2067;5 ס״מ&#x2069;</text>
          <text class="lbl" x="32" y="47" text-anchor="middle">A</text>
          <text class="lbl" x="168" y="47" text-anchor="middle">B</text>
          <text class="lbl" x="168" y="209" text-anchor="middle">C</text>
          <text class="lbl" x="32" y="209" text-anchor="middle">D</text>
        </svg>
      </div>
    </section>

  </div>
</main>
</body>
</html>
